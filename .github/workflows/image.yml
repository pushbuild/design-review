name: image
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/pushbuild/design-review
          # tag v1.2.3 -> :1.2.3 and :latest; push to main -> :main and :sha-<short>. Released tags are never rebuilt from main.
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=branch
            type=sha
      - name: Version
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: image
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.v.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          img=ghcr.io/pushbuild/design-review:sha-${GITHUB_SHA::7}
          docker pull "$img"
          mkdir -p t && cd t
          docker run --rm "$img" source fixture.html > fixture.html
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD":"$PWD" -w "$PWD" "$img" ui-audit ./fixture.html ./out/fx --widths 375,1440
          test -s out/fx-report.json
