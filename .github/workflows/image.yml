name: image
# One-time, by an org owner in the UI (GitHub has no API for it): make the package public at
# https://github.com/orgs/pushbuild/packages/container/design-review/settings -> Danger Zone -> Change visibility -> Public.
# GHCR sometimes answers a push with 403 (read_package/write_package or a blob HEAD); re-running the job has cleared it.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: image
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/pushbuild/design-review
          # tag v1.2.3 -> :1.2.3 and :latest (metadata-action adds latest for semver tags); push to main -> :main and :sha-<short>. Released tags are never rebuilt from main, and no tag is pushed by two runs (GHCR answers concurrent pushes of one tag with 403).
          tags: |
            type=semver,pattern={{version}}
            type=ref,event=branch
            type=sha,enable=${{ github.ref_type == 'branch' }}
      - name: Version
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: image
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.v.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          img=$(echo '${{ steps.meta.outputs.tags }}' | head -1)
          docker pull "$img"
          mkdir -p t && cd t
          docker run --rm "$img" source fixture.html > fixture.html
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD":"$PWD" -w "$PWD" "$img" ui-audit ./fixture.html ./out/fx --widths 375,1440
          test -s out/fx-report.json
